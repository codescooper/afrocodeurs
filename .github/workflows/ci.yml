name: CI

# Filet qualité automatique : sur chaque push (main/master) et chaque Pull Request.
# Dogfoode le runner du projet (./run) et valide aussi les migrations Prisma.
on:
  push:
    branches: [main, master]
  pull_request:

# Annule les exécutions superflues sur une même branche / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest

    # Base Postgres éphémère : sert à valider les migrations (et, plus tard, les tests).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: afrocodeurs
          POSTGRES_PASSWORD: afrocodeurs
          POSTGRES_DB: afrocodeurs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afrocodeurs -d afrocodeurs -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Valeurs de CI uniquement — jamais de secret réel ici (utiliser GitHub Secrets pour le déploiement).
      DATABASE_URL: postgresql://afrocodeurs:afrocodeurs@localhost:5432/afrocodeurs?schema=public
      AUTH_SECRET: ci-placeholder-secret-non-utilise-en-production
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bloque le retour d'une vulnérabilité élevée ou critique dans les dépendances
      # exécutées en production, sans masquer les alertes non critiques.
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Prepare isolated integration databases
        env:
          PGPASSWORD: afrocodeurs
        run: |
          createdb --host=127.0.0.1 --port=5432 --username=afrocodeurs constellation_test
          createdb --host=127.0.0.1 --port=5432 --username=afrocodeurs mentorship_test
          DATABASE_URL=postgresql://afrocodeurs:afrocodeurs@127.0.0.1:5432/constellation_test npx prisma migrate deploy
          DATABASE_URL=postgresql://afrocodeurs:afrocodeurs@127.0.0.1:5432/mentorship_test npx prisma migrate deploy

      - name: Lint
        run: ./run lint

      - name: Test public discovery checker
        run: node --test scripts/check-public-discovery.test.mjs

      - name: Test
        env:
          CONSTELLATION_TEST_DATABASE_URL: postgresql://afrocodeurs:afrocodeurs@127.0.0.1:5432/constellation_test
          MENTORSHIP_TEST_DATABASE_URL: postgresql://afrocodeurs:afrocodeurs@127.0.0.1:5432/mentorship_test
        run: npm test

      - name: Build
        run: ./run build

      - name: Install Chromium for Constellation regression
        run: npx playwright install --with-deps chromium --only-shell

      - name: Browser regression (Constellation)
        timeout-minutes: 10
        env:
          DATABASE_URL: postgresql://afrocodeurs:afrocodeurs@127.0.0.1:5432/constellation_test
          AUTH_TRUST_HOST: "true"
          NEXTAUTH_URL: http://127.0.0.1:3042
          CONSTELLATION_QA_ORIGIN: http://127.0.0.1:3042
          CONSTELLATION_QA_OUTPUT: ${{ runner.temp }}/constellation-browser
          QA_BROWSER: chromium
          # Official Cloudflare dummy keys, localhost-only recipe; no real secrets.
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          POW_ENABLED: "true"
          POW_DIFFICULTY: "20"
          EARLY_ACCESS_SEQUENCE: sun,baobab,laptop,logo
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3042 > "$RUNNER_TEMP/constellation-server.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3042/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/constellation-server.log"
            exit 1
          fi
          node scripts/constellation-browser-qa.mjs
          SECURITY_QA_ORIGIN=http://127.0.0.1:3042 SECURITY_QA_OUTPUT="$RUNNER_TEMP/constellation-browser/security" node scripts/security-browser-qa.mjs
          SIGNUP_QA_ORIGIN=http://127.0.0.1:3042 SIGNUP_QA_OUTPUT="$RUNNER_TEMP/constellation-browser/signup" node scripts/signup-browser-qa.mjs

      - name: Upload Constellation browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: constellation-browser-evidence
          path: ${{ runner.temp }}/constellation-browser/
          if-no-files-found: ignore
          retention-days: 7
